<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- 【変更】スマホで正しい幅で表示するため追加 -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>タスク一覧</title>
    <link rel="icon" href="logo-mark.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="index.html" class="home-link">‹ 戻る</a>
        <!-- 【変更】見出し・ボタン・メッセージの文言を、AIっぽくない短い表現に変更 -->
        <h1>タスク一覧</h1>
    </header>
    <div class="container">
        <!-- 【変更】配色の統一のため、紫の直接指定をやめて枠線のボタンにした -->
        <button id="btn-run-batch" class="primary-btn" style="margin-bottom: 20px;">
            完了済みのタスクを整理
        </button>

        <table>
            <thead>
                <tr>
                    <th>タスク名</th>
                    <th>期限</th>
                    <th>時間(分)</th>
                    <th>カテゴリ</th>
                    <th>状態</th>
                </tr>
            </thead>
            <tbody id="task-table-body"></tbody>
        </table>
    </div>

    <!-- 【変更】ログイン管理の共通処理を読み込み、未ログインならログイン画面へ -->
    <script src="auth.js"></script>
    <script>
        requireLogin();

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await apiFetch("/api/get_tasks");
                // 【変更】エラー応答のときは成功扱いにしない
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const tasks = await res.json();
                
                const tbody = document.getElementById('task-table-body');
                tbody.innerHTML = '';
                
                tasks.forEach(t => {
                    const isCompleted = t.status === '完了';
                    const rowStyle = isCompleted ? 'style="color: #888; text-decoration: line-through; background-color: #f0f0f0;"' : '';
                    const timeDisplay = isCompleted && t.actual_minutes 
                        ? `${t.estimated_minutes} (実績: ${t.actual_minutes})` 
                        : `${t.estimated_minutes}`;

                    // 【変更】スマホのカード表示で項目名を出すため、各セルに data-label を追加
                    tbody.innerHTML += `
                        <tr ${rowStyle}>
                            <td data-label="タスク名">${t.title}</td>
                            <td data-label="期限">${t.deadline || '-'}</td>
                            <td data-label="時間(分)">${timeDisplay}</td>
                            <td data-label="カテゴリ">${t.category}</td>
                            <td data-label="状態">${t.status}</td>
                        </tr>
                    `;
                });
            } catch (e) {
                alert("タスクの取得に失敗しました。");
            }
        });

        document.getElementById('btn-run-batch').addEventListener('click', async () => {
            if (!confirm("完了済みのタスクを一覧から削除します。かかった時間の記録は、今後のプラン作りに使われます。よろしいですか？")) return;

            // 【変更】通信中はボタンを押せなくする (連打防止)
            const btn = document.getElementById('btn-run-batch');
            btn.disabled = true;
            try {
                const res = await apiFetch("/api/run_weekly_batch", { method: "POST" });
                // 【変更】エラー応答のときは成功扱いにしない
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();

                if (data.status === "success") {
                    alert("整理しました。\n\nあなたの傾向:\n" + data.profile);
                    location.reload();
                    return;
                }
                alert(data.message);
            } catch (e) {
                alert("整理に失敗しました。");
            }
            btn.disabled = false;
        });
    </script>
</body>
</html>
