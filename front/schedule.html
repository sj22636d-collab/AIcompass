<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- 【変更】スマホで正しい幅で表示するため追加 -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>今日やることを決める</title>
    <link rel="icon" href="logo-mark.svg?v=2" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="index.html" class="home-link">‹ 戻る</a>
        <!-- 【変更】どのページでもロゴを同じ位置に出し、押すとホームに戻れるようにした -->
        <a href="index.html" class="logo-link" aria-label="ホームに戻る"><img src="logo.svg" alt="AICompass" class="header-logo"></a>
    </header>
    <div class="container">
        <!-- 【変更】ページ名はヘッダーから、この枠の上部に移した -->
        <h1 class="page-title">今日やることを決める</h1>
        <div id="input-section">
            <h2>今日の空き時間や調子</h2>
            <textarea id="condition-input" placeholder="例: 午後から2時間だけ。疲れてる。"></textarea>
            <button id="btn-generate" class="secondary-btn">決める</button>
        </div>

        <div id="loading" class="hidden">読み込み中...</div>

        <!-- 【変更】AI の結果は「おすすめ」として出し、ホームに追加するタスクを自分で選ぶ方式にした -->
        <div id="result-section" class="result-box hidden">
            <p class="ai-reason" id="ai-message"></p>

            <h2 class="list-heading">おすすめのタスク</h2>
            <p class="list-hint">今日やるタスクを押して選んでください（いくつでも選べます）</p>
            <p id="no-recommend" class="plan-empty hidden">おすすめはありませんでした。下のタスクから選べます。</p>
            <ul id="schedule-list" class="plan-list" aria-label="おすすめのタスク"></ul>

            <div id="others-section" class="hidden">
                <h2 class="list-heading">ほかのタスク</h2>
                <ul id="others-list" class="plan-list" aria-label="ほかのタスク"></ul>
            </div>

            <button id="btn-add" class="secondary-btn toggle-btn" disabled style="margin-top: 16px;">選択したタスクをホームに追加</button>
            <button class="primary-btn" onclick="location.href='index.html'">ホームに戻る</button>
            <a href="#" id="retry-link" class="text-link">条件を変えて出し直す ›</a>
        </div>
    </div>

    <!-- 【変更】ログイン管理の共通処理を読み込み、未ログインならログイン画面へ -->
    <script src="auth.js"></script>
    <script>
        requireLogin();

        // 【変更】端末のローカル日付を YYYY-MM-DD で返す (toISOString は UTC なので朝9時前に前日になる)
        function todayString() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        document.getElementById('btn-generate').addEventListener('click', async () => {
            const text = document.getElementById('condition-input').value;
            if (!text) return alert('入力してください');

            // 【変更】通信中はボタンを押せなくする (連打防止)
            const btn = document.getElementById('btn-generate');
            btn.disabled = true;
            document.getElementById('loading').classList.remove('hidden');

            try {
                const res = await apiFetch("/api/generate_schedule", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ condition_text: text })
                });
                // 【変更】エラー応答や想定外の形の応答では結果を出さない
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                if (!Array.isArray(data.schedule)) throw new Error("schedule がありません");

                document.getElementById('ai-message').textContent = data.ai_message ?? '';
                // 【変更】メッセージが空のときは空の枠を出さない
                document.getElementById('ai-message').classList.toggle('hidden', !data.ai_message);

                // 【変更】おすすめ以外の未着手タスクも選べるように、タスク一覧も取得する
                const tasksRes = await apiFetch("/api/get_tasks");
                if (!tasksRes.ok) throw new Error(`HTTP ${tasksRes.status}`);
                const tasks = await tasksRes.json();

                // すでに今日の予定に入っているタスクは、重ねて出さない
                const plan = loadTodayPlan();
                const inPlan = new Set(plan ? plan.schedule.map(t => t.task_id) : []);
                // 【変更】推定時間を横に出すため、タスク一覧から見積もり時間を引いてくる
                const minutesById = Object.fromEntries(tasks.map(t => [t.id, t.estimated_minutes]));
                const recommended = data.schedule
                    .filter(t => !inPlan.has(t.task_id))
                    .map(t => ({ ...t, estimated_minutes: minutesById[t.task_id] }));
                const recommendedIds = new Set(recommended.map(t => t.task_id));
                const others = tasks
                    .filter(t => t.status === '未着手' && !inPlan.has(t.id) && !recommendedIds.has(t.id))
                    .map(t => ({ task_id: t.id, title: t.title, reason: '', estimated_minutes: t.estimated_minutes }));

                selected.clear();
                renderChoices('schedule-list', recommended);
                renderChoices('others-list', others);
                document.getElementById('no-recommend').classList.toggle('hidden', recommended.length > 0);
                document.getElementById('others-section').classList.toggle('hidden', others.length === 0);
                updateAddButton();

                document.getElementById('input-section').classList.add('hidden');
                document.getElementById('result-section').classList.remove('hidden');
            } catch (e) {
                alert("作成に失敗しました。時間をおいてもう一度お試しください。");
            } finally {
                btn.disabled = false;
                document.getElementById('loading').classList.add('hidden');
            }
        });

        // ==========================================
        // 【変更】おすすめ・ほかのタスクから選んでホームに追加する
        // ==========================================
        const selected = new Map();  // task_id → {task_id, title, reason}

        function loadTodayPlan() {
            try {
                const plan = JSON.parse(localStorage.getItem(planStorageKey()));
                if (plan && plan.date === todayString() && Array.isArray(plan.schedule)) return plan;
            } catch (e) {}
            return null;
        }

        function toggleTask(li, task) {
            if (selected.has(task.task_id)) {
                selected.delete(task.task_id);
                li.classList.remove('selected');
                li.setAttribute('aria-checked', 'false');
            } else {
                selected.set(task.task_id, task);
                li.classList.add('selected');
                li.setAttribute('aria-checked', 'true');
            }
            updateAddButton();
        }

        // 【変更】推定時間を「約30分」「約1時間30分」の形にする
        function formatMinutes(min) {
            const h = Math.floor(min / 60), m = min % 60;
            if (h === 0) return `約${m}分`;
            return m === 0 ? `約${h}時間` : `約${h}時間${m}分`;
        }

        function renderChoices(listId, items) {
            const list = document.getElementById(listId);
            list.innerHTML = '';
            items.forEach(task => {
                const li = document.createElement('li');
                li.className = 'selectable multi';
                li.tabIndex = 0;
                li.setAttribute('role', 'checkbox');
                li.setAttribute('aria-checked', 'false');
                const title = document.createElement('strong');
                title.textContent = task.title || task.task_id;
                li.append(title);
                // 【変更】タスクの横に推定時間を表示する
                // 【変更】おすすめには今日の調子で補正した時間だけを出す (補正がないタスクは見積もり時間)
                const adjusted = task.adjusted_minutes > 0 ? task.adjusted_minutes : null;
                const shownMinutes = adjusted ?? task.estimated_minutes;
                if (shownMinutes > 0) {
                    const est = document.createElement('span');
                    est.className = 'est-time';
                    est.textContent = formatMinutes(shownMinutes);
                    li.classList.add('with-time');
                    li.append(est);
                }
                if (task.reason) {
                    const reason = document.createElement('span');
                    reason.textContent = task.reason;
                    li.append(reason);
                }
                li.addEventListener('click', () => toggleTask(li, task));
                li.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleTask(li, task); }
                });
                list.append(li);
            });
        }

        // 1つも選んでいないときは押せない薄い白ボタン、選ぶとネイビーのボタンになる
        function updateAddButton() {
            const btn = document.getElementById('btn-add');
            btn.disabled = selected.size === 0;
            btn.textContent = selected.size === 0
                ? '選択したタスクをホームに追加'
                : `選択したタスクをホームに追加（${selected.size}件）`;
        }

        document.getElementById('btn-add').addEventListener('click', () => {
            if (selected.size === 0) return;
            // 今日の予定がすでにあれば、その後ろに追加する
            const plan = loadTodayPlan();
            const schedule = (plan ? plan.schedule : []).concat(
                [...selected.values()].map(t => ({ task_id: t.task_id, title: t.title, reason: t.reason || '' }))
            );
            try {
                // 別のユーザーの予定と混ざらないよう、ユーザーごとのキーで保存する
                localStorage.setItem(planStorageKey(), JSON.stringify({ date: todayString(), schedule }));
            } catch (e) {
                return alert('この端末には予定を保存できませんでした。');
            }
            location.href = 'index.html';
        });

        document.getElementById('retry-link').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('result-section').classList.add('hidden');
            document.getElementById('input-section').classList.remove('hidden');
        });
    </script>
</body>
</html>
