<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 64" role="img" aria-label="AICompass">
  <!-- AICompass ロゴ (マーク + 文字)。頭文字「C」の形の輪と、切れ目から抜けるローズの針 -->
  <g>
    <circle cx="32" cy="32" r="22" fill="none" stroke="#2E3A59" stroke-width="6" stroke-linecap="round" stroke-dasharray="104 34.2"/>
    <g transform="rotate(45 32 32)">
      <polygon points="32,8 36.5,32 27.5,32" fill="#E0677D"/>
      <polygon points="32,46 36.5,32 27.5,32" fill="#C9D1E3"/>
    </g>
    <circle cx="32" cy="32" r="3" fill="#2E3A59"/>
  </g>
  <text x="70" y="43" font-family="'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="0.5">
    <tspan fill="#E0677D">AI</tspan><tspan fill="#2E3A59">Compass</tspan>
  </text>
</svg>
