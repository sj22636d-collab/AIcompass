<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>完了報告</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="index.html" class="home-link">◀ 戻る</a>
        <h1>完了報告</h1>
    </header>
    <div class="container">
        <div id="input-section">
            <h2>何を終わらせましたか？</h2>
            <textarea id="report-input" placeholder="例: A社の提案書作成、3時間かかった！"></textarea>
            <button id="btn-report" class="danger-btn">AIに報告する</button>
        </div>

        <div id="loading" class="hidden">AIがタスクを照合中...</div>

        <div id="confirm-section" class="result-box hidden">
            <h2>以下のタスクを完了にしますか？</h2>
            <p><strong>特定されたタスク:</strong> <span id="res-task-name"></span></p>
            
            <label>実際にかかった時間 (分) ※修正可能</label>
            <input type="number" id="actual-time">

            <button id="btn-complete" class="primary-btn">完了として記録する</button>
        </div>
    </div>

    <script>
        let currentTaskId = null;

        document.getElementById('btn-report').addEventListener('click', async () => {
            const text = document.getElementById('report-input').value;
            if (!text) return alert('入力してください');
            
            document.getElementById('loading').classList.remove('hidden');
            
            try {
                const res = await fetch("http://127.0.0.1:8000/api/parse_completion", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ report_text: text })
                });
                const data = await res.json();
                
                if (!data.task_id) {
                    alert("該当する未着手タスクが見つかりませんでした。");
                    document.getElementById('loading').classList.add('hidden');
                    return;
                }
                
                currentTaskId = data.task_id;
                document.getElementById('res-task-name').textContent = data.task_title;
                document.getElementById('actual-time').value = data.actual_minutes || 0;
                
                document.getElementById('input-section').classList.add('hidden');
                document.getElementById('confirm-section').classList.remove('hidden');
            } catch (e) {
                alert("エラーが発生しました。");
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        });

        document.getElementById('btn-complete').addEventListener('click', async () => {
            const actualMinutes = parseInt(document.getElementById('actual-time').value) || 0;
            try {
                const res = await fetch("http://127.0.0.1:8000/api/complete_task", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ task_id: currentTaskId, actual_minutes: actualMinutes })
                });
                if (res.ok) {
                    alert("完了時間を記録し、ステータスを更新しました！");
                    location.href = 'index.html';
                }
            } catch (e) {
                alert("記録中にエラーが発生しました。");
            }
        });
    </script>
</body>
</html>
