<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- 【変更】スマホで正しい幅で表示するため追加 -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>終わったタスクを記録</title>
    <link rel="icon" href="logo-mark.svg?v=2" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="index.html" class="home-link">‹ 戻る</a>
        <!-- 【変更】どのページでもロゴを同じ位置に出し、押すとホームに戻れるようにした -->
        <a href="index.html" class="logo-link" aria-label="ホームに戻る"><img src="logo.svg" alt="AICompass" class="header-logo"></a>
    </header>
    <div class="container">
        <!-- 【変更】ページ名はヘッダーから、この枠の上部に移した -->
        <h1 class="page-title">終わったタスクを記録</h1>
        <div id="input-section">
            <h2>何を終わらせましたか？</h2>
            <textarea id="report-input" placeholder="例: A社の提案書作成、3時間かかった！"></textarea>
            <button id="btn-report" class="danger-btn">次へ</button>
        </div>

        <div id="loading" class="hidden">読み込み中...</div>

        <div id="confirm-section" class="result-box hidden">
            <h2>このタスクを完了にしますか？</h2>
            <!-- 【変更前】
            <p><strong>タスク:</strong> <span id="res-task-name"></span></p>
            -->
            <!-- 【変更後】ドロップダウンに変更 -->
            <p><strong>タスク:</strong> 
                <select id="task-select" class="form-input"></select>
            </p>
            
            <label>かかった時間 (分)</label>
            <input type="number" id="actual-time">

            <button id="btn-complete" class="primary-btn">完了にする</button>
        </div>
    </div>

    <!-- 【変更】ログイン管理の共通処理を読み込み、未ログインならログイン画面へ -->
    <script src="auth.js"></script>
    <script>
        requireLogin();

        // ユーザーの未着手タスクを保持する変数
        let pendingTasks = [];

        // ページ読み込み時に未着手タスク一覧を取得しておく
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await apiFetch("/api/get_tasks");
                if (res.ok) {
                    const tasks = await res.json();
                    // 「未着手」のタスクだけを絞り込み
                    pendingTasks = tasks.filter(t => t.status === '未着手');
                }
            } catch (e) {
                console.error("タスク一覧の取得に失敗しました", e);
            }
        });

        document.getElementById('btn-report').addEventListener('click', async () => {
            const text = document.getElementById('report-input').value;
            if (!text) return alert('入力してください');

            const btn = document.getElementById('btn-report');
            btn.disabled = true;
            document.getElementById('loading').classList.remove('hidden');

            try {
                const res = await apiFetch("/api/parse_completion", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ report_text: text })
                });
                
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();

                // 【追加】ドロップダウン(select)の選択肢を生成する
                const selectEl = document.getElementById('task-select');
                selectEl.innerHTML = ''; // 中身をリセット
                
                pendingTasks.forEach(task => {
                    const option = document.createElement('option');
                    option.value = task.id;
                    option.textContent = task.title;
                    
                    // AIが推測したタスクIDと一致すれば、初期選択状態にする
                    if (data.task_id && task.id === data.task_id) {
                        option.selected = true;
                    }
                    selectEl.appendChild(option);
                });

                // 万が一未着手タスクが1つもない場合の警告
                if (pendingTasks.length === 0) {
                    alert("完了できる未着手タスクがありません。");
                    return;
                }

                if (!data.task_id) {
                    // AIが特定できなかった場合でも、手動で選べるように確認画面には進む
                    alert("自動判定できませんでした。リストからタスクを選択してください。");
                }
                
                document.getElementById('actual-time').value = data.actual_minutes || 0;
                
                document.getElementById('input-section').classList.add('hidden');
                document.getElementById('confirm-section').classList.remove('hidden');
            } catch (e) {
                alert("読み取りに失敗しました。時間をおいてもう一度お試しください。");
            } finally {
                btn.disabled = false;
                document.getElementById('loading').classList.add('hidden');
            }
        });

        document.getElementById('btn-complete').addEventListener('click', async () => {
            const btn = document.getElementById('btn-complete');
            
            // 【変更】変数 currentTaskId ではなく、ドロップダウンから選択中のIDを取得する
            const selectedTaskId = document.getElementById('task-select').value;
            const actualMinutes = parseInt(document.getElementById('actual-time').value) || 0;
            
            btn.disabled = true;
            try {
                const res = await apiFetch("/api/complete_task", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ task_id: selectedTaskId, actual_minutes: actualMinutes })
                });
                if (res.ok) {
                    alert("記録しました");
                    location.href = 'index.html';
                    return;
                }
                alert(res.status === 404 ? "このタスクは見つかりませんでした。" : "記録に失敗しました。");
            } catch (e) {
                alert("記録に失敗しました。");
            }
            btn.disabled = false;
        });
    </script>
</body>
</html>
