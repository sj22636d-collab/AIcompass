<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- 【変更】スマホで正しい幅で表示するため追加 -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AICompass｜タスク管理アプリ</title>
    <link rel="icon" href="logo-mark.svg?v=2" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <!-- 【変更】ほかのページと同じく、ロゴを押すとホーム (このページ) を開く -->
        <a href="index.html" class="logo-link" aria-label="ホーム"><img src="logo.svg" alt="AICompass" class="header-logo"></a>
    </header>
    <div class="container">
        <!-- 【変更】ログイン中のユーザー名とログアウト -->
        <div class="user-bar">
            <span id="user-name"></span>
            <a href="#" id="logout-link">ログアウト</a>
        </div>

        <!-- 【変更】ホーム画面を作り直し: サーバー停止時の表示・期限のお知らせ・今日の予定・状況に応じて変わる大きいボタン -->
        <p id="server-error" class="notice-error hidden">サーバーにつながりません。バックエンドが起動しているか確認してください。</p>

        <section id="deadline-alerts" class="hidden">
            <h2>期限が迫っているタスク</h2>
            <ul id="deadline-list" class="deadline-list"></ul>
        </section>

        <section id="today-plan">
            <div class="plan-header">
                <h2>今日の予定</h2>
                <span id="today-plan-progress" class="plan-progress"></span>
            </div>
            <p id="plan-message" class="plan-empty">まだ決めていません</p>
            <ul id="today-plan-list" class="plan-list" role="radiogroup" aria-label="完了にするタスク"></ul>

            <!-- 【変更】今日の予定からタスクを選んで、その場で完了にする -->
            <div id="complete-area" class="hidden">
                <div id="minutes-row" class="minutes-row hidden">
                    <label for="actual-time">かかった時間 (分)</label>
                    <input type="number" id="actual-time" min="1" inputmode="numeric">
                </div>
                <button id="complete-btn" class="secondary-btn toggle-btn" disabled>完了</button>
            </div>
            <a id="replan-link" class="text-link hidden" href="schedule.html">おすすめからタスクを追加 ›</a>
        </section>

        <!-- 状況によって中身が変わる。そのとき一番よく使う操作だけを大きく出す -->
        <button id="main-action" class="secondary-btn" onclick="location.href='schedule.html'">今日やることを決める</button>

        <div class="sub-actions">
            <button id="sub-add" class="primary-btn" onclick="location.href='add_task.html'">タスクを追加</button>
            <button class="primary-btn" onclick="location.href='all_tasks.html'">タスク一覧</button>
        </div>
    </div>

    <!-- 【変更】予定・期限の表示と、状況に応じたボタンの切り替えを行う処理を追加 -->
    <!-- 【変更】ログイン管理の共通処理を読み込み、未ログインならログイン画面へ -->
    <script src="auth.js"></script>
    <script>
        const auth = requireLogin();
        if (auth) document.getElementById('user-name').textContent = `${auth.username} さん`;
        document.getElementById('logout-link').addEventListener('click', (e) => {
            e.preventDefault();
            logout();
        });

        function todayString() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        function setMainAction(label, href) {
            const btn = document.getElementById('main-action');
            btn.textContent = label;
            btn.onclick = () => { location.href = href; };
        }

        function loadTodayPlan() {
            try {
                // 【変更】予定はユーザーごとのキーで保存している
                const plan = JSON.parse(localStorage.getItem(planStorageKey()));
                // 前日以前に作った予定は使わない
                if (plan && plan.date === todayString() && Array.isArray(plan.schedule) && plan.schedule.length > 0) return plan;
            } catch (e) {
                // 保存できない環境や壊れたデータのときは予定なし扱い
            }
            return null;
        }

        // サーバーが応答しないときに待ち続けないよう、5秒で打ち切る
        async function fetchTasks() {
            try {
                const res = await apiFetch("/api/get_tasks", { signal: AbortSignal.timeout(5000) });
                if (!res.ok) return null;
                return await res.json();
            } catch (e) {
                return null;
            }
        }

        function renderDeadlineAlerts(tasks) {
            const today = todayString();
            const urgent = tasks
                .filter(t => t.status === '未着手' && /^\d{4}-\d{2}-\d{2}$/.test(t.deadline || '') && t.deadline <= today)
                .sort((a, b) => a.deadline.localeCompare(b.deadline));
            if (urgent.length === 0) return;

            const list = document.getElementById('deadline-list');
            urgent.forEach(t => {
                const overdue = t.deadline < today;
                const [, m, d] = t.deadline.split('-').map(Number);
                const li = document.createElement('li');
                const badge = document.createElement('span');
                badge.className = overdue ? 'badge badge-overdue' : 'badge badge-today';
                badge.textContent = overdue ? `期限切れ ${m}/${d}` : '今日まで';
                const title = document.createElement('span');
                title.textContent = t.title;
                li.append(badge, title);
                list.append(li);
            });
            document.getElementById('deadline-alerts').classList.remove('hidden');
        }

        // 【変更】今日の予定のタスクを選ぶと「完了」ボタンが押せるようになる
        let selectedTaskId = null;

        function selectTask(li, task) {
            // 【変更】選んでいるタスクをもう一度押すと選択を解除し、完了ボタンを押せない状態に戻す
            if (selectedTaskId === task.id) {
                li.classList.remove('selected');
                li.setAttribute('aria-checked', 'false');
                selectedTaskId = null;
                document.getElementById('minutes-row').classList.add('hidden');
                document.getElementById('complete-btn').disabled = true;
                return;
            }
            document.querySelectorAll('#today-plan-list li.selectable').forEach(el => {
                el.classList.remove('selected');
                el.setAttribute('aria-checked', 'false');
            });
            li.classList.add('selected');
            li.setAttribute('aria-checked', 'true');
            selectedTaskId = task.id;

            // 見積もり時間を初期値にしておき、違えば直してもらう
            const input = document.getElementById('actual-time');
            input.value = task.estimated_minutes > 0 ? task.estimated_minutes : '';
            document.getElementById('minutes-row').classList.remove('hidden');
            document.getElementById('complete-btn').disabled = false;
        }

        function renderPlan(plan, statusById, taskById) {
            const list = document.getElementById('today-plan-list');
            let doneCount = 0;
            plan.schedule.forEach(task => {
                // 週次の整理で完了タスクは削除されるので、一覧にないものも完了扱いにする
                const done = statusById !== null && (statusById[task.task_id] === '完了' || !(task.task_id in statusById));
                if (done) doneCount++;

                const li = document.createElement('li');
                if (done) li.classList.add('done');
                const title = document.createElement('strong');
                title.textContent = task.title || task.task_id;
                const reason = document.createElement('span');
                reason.textContent = task.reason || '';
                li.append(title, reason);

                // 【変更】まだ終わっていないタスクは押して選べるようにする
                const current = taskById && taskById[task.task_id];
                if (!done && current) {
                    li.classList.add('selectable', 'single');
                    li.tabIndex = 0;
                    li.setAttribute('role', 'radio');
                    li.setAttribute('aria-checked', 'false');
                    li.addEventListener('click', () => selectTask(li, current));
                    li.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectTask(li, current); }
                    });
                }
                list.append(li);
            });
            if (statusById !== null) {
                document.getElementById('today-plan-progress').textContent = `${doneCount} / ${plan.schedule.length} 完了`;
            }
            return doneCount === plan.schedule.length;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const plan = loadTodayPlan();
            const tasks = await fetchTasks();
            const message = document.getElementById('plan-message');

            if (tasks === null) {
                document.getElementById('server-error').classList.remove('hidden');
            } else {
                renderDeadlineAlerts(tasks);
            }

            const statusById = tasks === null ? null : Object.fromEntries(tasks.map(t => [t.id, t.status]));
            const taskById = tasks === null ? null : Object.fromEntries(tasks.map(t => [t.id, t]));
            const pendingCount = tasks === null ? null : tasks.filter(t => t.status === '未着手').length;

            if (!plan) {
                if (pendingCount === 0) {
                    // タスクが1件もないと予定は作れないので、まず登録へ案内する
                    message.textContent = 'まずはタスクを登録しましょう';
                    setMainAction('タスクを追加', 'add_task.html');
                    document.getElementById('sub-add').classList.add('hidden');
                }
                return;
            }

            const allDone = renderPlan(plan, statusById, taskById);
            if (allDone && statusById !== null) {
                message.textContent = '今日の予定はすべて完了しました';
                if (pendingCount === 0) {
                    setMainAction('タスクを追加', 'add_task.html');
                    document.getElementById('sub-add').classList.add('hidden');
                } else {
                    setMainAction('追加で決める', 'schedule.html');
                }
            } else if (statusById !== null) {
                // 【変更】予定の途中は、ここで選んで完了にする (大きいボタンの代わりに「完了」ボタン)
                message.textContent = '終わったタスクを選んでください';
                document.getElementById('complete-area').classList.remove('hidden');
                document.getElementById('replan-link').classList.remove('hidden');
                document.getElementById('main-action').classList.add('hidden');
            } else {
                // サーバーにつながらないときは完了にできないので、予定だけ表示する
                message.classList.add('hidden');
                document.getElementById('main-action').classList.add('hidden');
            }
        });

        // 【変更】選んだタスクを完了として記録する
        document.getElementById('complete-btn').addEventListener('click', async () => {
            const btn = document.getElementById('complete-btn');
            const minutes = parseInt(document.getElementById('actual-time').value, 10);
            if (!selectedTaskId) return;
            if (!(minutes > 0)) return alert('かかった時間を分で入力してください');

            btn.disabled = true;
            try {
                const res = await apiFetch("/api/complete_task", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ task_id: selectedTaskId, actual_minutes: minutes })
                });
                if (res.ok) {
                    location.reload();
                    return;
                }
                alert(res.status === 404 ? "このタスクは見つかりませんでした。" : "記録に失敗しました。");
            } catch (e) {
                alert("記録に失敗しました。");
            }
            btn.disabled = false;
        });
    </script>
</body>
</html>
